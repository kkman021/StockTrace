services:
  web:
    build: ./services/web
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CRAWLER_URL=http://crawler:8001
      - OPENSEARCH_URL=http://opensearch:9200
      - NOTIFICATION_CHANNELS=${NOTIFICATION_CHANNELS:-web}
    depends_on:
      - db
      - redis
      - opensearch
    volumes:
      - ./config:/app/config:ro
      - ./services/web/app:/app/app

  worker:
    build: ./services/worker
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CRAWLER_URL=http://crawler:8001
      - WEB_URL=http://web:8000
    depends_on:
      - db
      - redis
      - crawler
    volumes:
      - ./config:/app/config:ro
      - ./services/worker:/app

  beat:
    build: ./services/worker
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
    volumes:
      - ./services/worker:/app

  crawler:
    build: ./services/crawler
    expose:
      - "8001"
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - playwright-cache:/ms-playwright

  ui:
    build: ./services/ui
    ports:
      - "${UI_PORT:-5173}:80"
    depends_on:
      - web

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-etf_radar}
      - POSTGRES_USER=${POSTGRES_USER:-radar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  redis-data:
  playwright-cache:
  opensearch-data:
