services:
  web:
    build: ./services/web
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CRAWLER_URL=http://crawler:8001
    depends_on:
      - db
      - redis
    volumes:
      - ./config:/app/config:ro
      - ./services/web/app:/app/app

  worker:
    build: ./services/worker
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CRAWLER_URL=http://crawler:8001
    depends_on:
      - db
      - redis
      - crawler
    volumes:
      - ./config:/app/config:ro
      - ./services/worker:/app

  beat:
    build: ./services/worker
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
    volumes:
      - ./services/worker:/app

  crawler:
    build: ./services/crawler
    expose:
      - "8001"
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - playwright-cache:/ms-playwright

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-etf_radar}
      - POSTGRES_USER=${POSTGRES_USER:-radar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  playwright-cache:
